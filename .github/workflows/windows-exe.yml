name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "work"]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -e ".[build,documents,dev]"
      - name: Run tests
        run: pytest -q
      - name: Build executable
        run: pyinstaller --noconfirm --clean "AI_Novel_Factory.spec"
      - name: Verify packaged executable
        shell: pwsh
        run: |
          & "dist/AI Novel Factory.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Novel-Factory-Windows
          path: dist/AI Novel Factory.exe
