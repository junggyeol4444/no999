[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-novel-factory"
version = "0.1.0"
description = "Long-form novel planning, reference analysis, memory and quality pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
documents = ["pypdf>=5.0,<6"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
novel-factory = "novel_factory.cli:main"

[tool.setuptools.packages.find]
include = ["novel_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
